let paletteEl=null;
let palItems=[];
let palIndex=0;
function paletteActions(){
  return [
    {label:'Start session',hint:'S',icon:'play',group:'Actions',run:()=>startSession(null)},
    {label:'New card',icon:'plus',group:'Actions',run:()=>openCardModal()},
    {label:'New deck',icon:'library',group:'Actions',run:()=>openDeckModal()},
    {label:'Go to Today',icon:'today',group:'Go',run:()=>{location.hash='#/today';}},
    {label:'Go to Library',icon:'library',group:'Go',run:()=>{location.hash='#/library';}},
    {label:'Go to Insights',icon:'chart',group:'Go',run:()=>{location.hash='#/insights';}},
    {label:'Go to Settings',icon:'settings',group:'Go',run:()=>{location.hash='#/settings';}},
    {label:'Toggle theme',icon:resolvedTheme()==='dark'?'sun':'moon',group:'Actions',run:toggleTheme},
    {label:'Import data',icon:'upload',group:'Actions',run:openImport},
    {label:'Export JSON',icon:'download',group:'Actions',run:exportJSON},
    {label:'Load starter decks',icon:'refresh',group:'Actions',run:loadStarter}
  ];
}
function buildPaletteItems(q){
  const query=String(q||'').trim().toLowerCase();
  const out=[];
  paletteActions().forEach(a=>{
    if(!query||a.label.toLowerCase().includes(query))out.push(a);
  });
  Object.values(state.decks).forEach(d=>{
    if(query&&!(d.name.toLowerCase().includes(query)||d.note.toLowerCase().includes(query)))return;
    out.push({label:d.name,hint:plural(deckCards(d.id).length,'card'),icon:'layers',group:'Decks',run:()=>{location.hash='#/deck/'+encodeURIComponent(d.id);}});
  });
  if(query){
    const matches=allCards().filter(c=>c.q.toLowerCase().includes(query)||c.a.toLowerCase().includes(query)).slice(0,8);
    matches.forEach(c=>{
      out.push({label:trunc(c.q,72),hint:deckName(c),icon:'book',group:'Cards',run:()=>startSession(c.deckId,c.id)});
    });
  }
  return out;
}
function openPalette(){
  if(paletteEl||session)return;
  paletteEl=document.createElement('div');
  paletteEl.className='palette-scrim';
  paletteEl.innerHTML='<div class="palette" role="dialog" aria-modal="true" aria-label="Search and jump">'+
    '<div class="palette-search">'+icon('search')+'<input id="palInput" type="text" placeholder="Search cards, decks and actions" aria-label="Search cards, decks and actions" autocomplete="off" spellcheck="false"></div>'+
    '<div class="palette-list" id="palList"></div>'+
    '<div class="palette-foot"><span class="keys"><kbd>↑</kbd><kbd>↓</kbd> move</span><span class="keys"><kbd>↵</kbd> open</span><span class="keys"><kbd>Esc</kbd> close</span></div></div>';
  document.body.appendChild(paletteEl);
  document.body.classList.add('modal-open');
  paletteEl.addEventListener('click',e=>{if(e.target===paletteEl)closePalette();});
  const input=$('#palInput',paletteEl);
  palIndex=0;
  renderPalette('');
  input.addEventListener('input',()=>{palIndex=0;renderPalette(input.value);});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(palItems.length){palIndex=(palIndex+1)%palItems.length;renderPalette(input.value);}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(palItems.length){palIndex=(palIndex-1+palItems.length)%palItems.length;renderPalette(input.value);}}
    else if(e.key==='Enter'){e.preventDefault();const it=palItems[palIndex];if(it)runPalette(it);}
    else if(e.key==='Escape'){e.preventDefault();closePalette();}
    else if(e.key==='Tab'){e.preventDefault();}
  });
  const list=$('#palList',paletteEl);
  list.addEventListener('click',e=>{
    const btn=e.target.closest('[data-pal]');
    if(!btn)return;
    const it=palItems[Number(btn.dataset.pal)];
    if(it)runPalette(it);
  });
  requestAnimationFrame(()=>input.focus());
}
function runPalette(item){
  closePalette();
  if(item&&item.run)setTimeout(()=>item.run(),10);
}
function closePalette(){
  if(!paletteEl)return;
  paletteEl.remove();
  paletteEl=null;
  if(!$('#modalRoot .scrim'))document.body.classList.remove('modal-open');
}
function renderPalette(q){
  if(!paletteEl)return;
  palItems=buildPaletteItems(q).slice(0,40);
  palIndex=clamp(palIndex,0,Math.max(0,palItems.length-1));
  const list=$('#palList',paletteEl);
  if(!palItems.length){
    list.innerHTML='<div class="palette-empty">Nothing matches “'+esc(trunc(q,42))+'”. Try a card, deck or action.</div>';
    return;
  }
  let html='';
  let group='';
  palItems.forEach((it,i)=>{
    if(it.group!==group){group=it.group;html+='<div class="pal-group">'+esc(group)+'</div>';}
    html+='<button type="button" class="pal-item'+(i===palIndex?' on':'')+'" data-pal="'+i+'" aria-selected="'+(i===palIndex)+'">'+
      icon(it.icon||'arrow')+'<span class="pal-label">'+esc(it.label)+(it.hint?'<small>'+esc(it.hint)+'</small>':'')+'</span><span class="k">'+icon('arrow')+'</span></button>';
  });
  list.innerHTML=html;
  const on=list.querySelector('.pal-item.on');
  if(on)on.scrollIntoView({block:'nearest'});
}

function bindView(r){

      deckFilter=b.dataset.deckFilter;
      route({keepScroll:true});

/* ============================================================
   Study session
   ============================================================ */
let session=null;
function currentCard(){return session?state.cards[session.queue[session.i]]:null;}
function startSession(deckId,oneCardId){
  if(session)return;
  let queue;
  if(oneCardId){
    const card=state.cards[oneCardId];
    if(!card){toast('That card no longer exists.','error');return;}
    queue=[oneCardId];
    deckId=card.deckId;
  }else{
    queue=buildQueue(deckId);
  }
  if(!queue.length){
    toast(deckId?'Nothing in this deck is ready yet.':'Nothing is ready right now.');
    return;
  }
  session={
    queue,i:0,deckId:deckId||null,single:!!oneCardId,
    rated:0,correct:0,again:0,started:Date.now(),reveal:false,done:false,
    repeats:{},ratings:{again:0,hard:0,good:0,easy:0}
  };
  document.body.classList.add('studying');
  renderStudy();
}
function closeSession(){
  session=null;
  document.body.classList.remove('studying');
  const root=$('#studyRoot');
  if(root)root.innerHTML='';
}
function leaveSession(){
  if(!session)return;
  if(session.done){finishSession();return;}
  if(!session.rated){closeSession();route({keepScroll:true});toast('Session closed.');return;}
  session.done=true;
  renderStudy();
}
function finishSession(){
  const rated=session?session.rated:0;
  closeSession();
  route();
  if(rated)toast(plural(rated,'review')+' saved.');
}
function finishToToday(){
  const rated=session?session.rated:0;
  closeSession();
  location.hash='#/today';
  route();
  if(rated)toast(plural(rated,'review')+' saved.');
}
function renderStudy(){
  const root=$('#studyRoot');
  if(!root||!session)return;
  if(session.done||session.i>=session.queue.length){renderSummary();return;}
  const card=currentCard();
  if(!card){session.i++;renderStudy();return;}
  const deck=deckOf(card);
  const st=statusOf(card);
  const total=session.queue.length;
  const pct=Math.round((session.i/total)*100);
  const color=(deck&&deck.color)||'verdigris';

  const meta='<div class="study-meta"><span class="dot c-'+color+'"></span><span>'+esc(deck?deck.name:'Unfiled')+'</span><span class="sep"></span><span>'+st.label+'</span><span class="sep"></span><span>Seen '+(card.seen||0)+'×</span></div>';
  const answer='<div class="study-a"><span class="label">Answer</span>'+esc(card.a)+'</div>';
  const hint='<div class="study-hint">'+icon('target')+'Say the answer before you look</div>';
  const ratings='<div class="study-foot">'+
    RATINGS.map((k,i)=>{
      const name=k[0].toUpperCase()+k.slice(1);
      return '<button class="rate-btn '+k+'" data-rate="'+k+'" aria-label="Rate '+name+', next review in '+previewLabel(card,k)+'"><b>'+name+'<span class="kbd">'+(i+1)+'</span></b><small>'+previewLabel(card,k)+'</small></button>';
    }).join('')+
  '</div><div class="reveal-row" style="margin-top:10px;justify-content:flex-end"><span class="study-keys"><span class="kbd">1</span>–<span class="kbd">4</span> rate<span style="width:8px"></span><span class="kbd">Esc</span> leave</span></div>';
  const revealRow='<div class="reveal-row"><button class="reveal-btn" data-act="reveal">'+icon('arrow')+'Show answer<span class="kbd">Space</span></button>'+
    '<span class="study-keys"><span class="kbd">Esc</span> leave</span></div>';

  root.innerHTML='<div class="study">'+
    '<div class="study-top">'+
      '<button class="btn ghost sm" data-act="exit-study">'+icon('x')+'Leave</button>'+
      '<div class="study-title"><span class="dot c-'+color+'"></span><b>'+esc(deck?deck.name:'Session')+'</b><span>· '+(session.single?'Single card':'Session')+'</span></div>'+
      '<div class="study-progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
      '<div class="study-count num">'+(session.i+1)+' / '+total+'</div>'+
    '</div>'+
    '<div class="study-body"><div class="study-card">'+
      meta+
      '<h1 class="study-q">'+esc(card.q)+'</h1>'+
      (session.reveal?answer:hint)+
      (session.reveal?ratings:revealRow)+
    '</div></div>'+
  '</div>';
}
function revealAnswer(){
  if(!session||session.done||session.reveal)return;
  session.reveal=true;
  renderStudy();
}
function rateCard(rating){
  if(!session||session.done||!session.reveal)return;
  if(!RATINGS.includes(rating))return;
  const card=currentCard();
  if(!card)return;
  schedule(card,rating);
  logStudy(card,rating);
  session.rated++;
  session.ratings[rating]++;
  if(rating==='again'){
    session.again++;
    session.repeats[card.id]=(session.repeats[card.id]||0)+1;
    if(session.repeats[card.id]<3)session.queue.push(card.id);
  }else{
    session.correct++;
  }
  save();
  session.i++;
  session.reveal=false;
  if(session.i>=session.queue.length)session.done=true;
  renderStudy();
}

/* ============================================================
   Summary
   ============================================================ */
function nextDueCopy(){
  const nd=nextDue();
  if(!nd)return 'No cards are scheduled.';
  const diff=nd-Date.now();
  if(diff<=0)return 'A card is ready now.';
  if(diff<60*60000)return 'Next review in '+Math.max(1,Math.round(diff/60000))+' min.';
  return 'Next review '+dueText(nd).toLowerCase()+'.';
}
function renderSummary(){
  const root=$('#studyRoot');
  if(!root||!session)return;
  const rated=session.rated||0;
  const accuracy=rated?Math.round((session.correct/rated)*100):0;
  const mins=Math.max(1,Math.round((Date.now()-session.started)/60000));
  const deck=session.deckId?state.decks[session.deckId]:null;
  const total=Object.values(session.ratings).reduce((a,b)=>a+b,0)||1;
  const rows=RATINGS.map(k=>{
    const n=session.ratings[k]||0;
    const pct=Math.round(n/total*100);
    return '<div class="rating-row"><span>'+k[0].toUpperCase()+k.slice(1)+'</span><div class="meter"><i class="'+k+'" style="width:'+pct+'%"></i></div><b>'+n+'</b></div>';
  }).join('');
  const copy=rated?
    ('You reviewed '+plural(rated,'card')+(deck?' in '+deck.name:'')+' with '+accuracy+'% recall. Every rating is saved and will shape the next schedule.'):
    'No cards were rated. Nothing has changed.';

  root.innerHTML='<div class="study"><div class="study-body"><div class="summary-card">'+
    '<span class="summary-eyebrow">Session complete</span>'+
    '<h2>'+(accuracy>=85&&rated?'Precise work.':rated?'Session complete.':'Session closed.')+'</h2>'+
    '<p class="lede">'+esc(copy)+'</p>'+
    '<div class="summary-grid">'+
      '<div><span>Reviewed</span><b>'+rated+'</b></div>'+
      '<div><span>Recall</span><b>'+(rated?accuracy+'<small>%</small>':'—')+'</b></div>'+
      '<div><span>Time</span><b>'+mins+'<small> min</small></b></div>'+
    '</div>'+
    (rated?'<div class="summary-ratings">'+rows+'</div>':'')+
    '<div class="summary-foot"><span class="summary-next">'+esc(nextDueCopy())+'</span>'+
      '<div style="display:flex;gap:8px"><button class="btn" data-act="exit-summary">Close</button><button class="btn primary" data-act="summary-done">Back to Today'+icon('arrow')+'</button></div>'+
    '</div>'+
  '</div></div></div>';
}
/* ============================================================
   Card form
   ============================================================ */
function openCardModal(cardId,presetDeckId){
  const card=cardId?state.cards[cardId]:null;
  if(cardId&&!card){toast('That card no longer exists.','error');return;}
  if(!totalDecks()){
    toast('Create a deck first.');
    openDeckModal();
    return;
  }
  const deckId=card?card.deckId:(presetDeckId&&state.decks[presetDeckId]?presetDeckId:Object.keys(state.decks)[0]);
  const options=Object.values(state.decks).map(d=>'<option value="'+d.id+'"'+(d.id===deckId?' selected':'')+'>'+esc(d.name)+'</option>').join('');
  openModal(
    modalHead(card?'Edit card':'New card',card?'Changes are saved as soon as you confirm.':'One question, one answer, filed in a deck.','book')+
    '<div class="modal-body">'+
      '<div class="field"><label for="cardDeck">Deck</label><select id="cardDeck" class="select">'+options+'</select></div>'+
      '<div class="field"><label for="cardQ">Question</label><textarea id="cardQ" class="textarea" placeholder="What do you want to recall?">'+esc(card?card.q:'')+'</textarea></div>'+
      '<div class="field"><label for="cardA">Answer</label><textarea id="cardA" class="textarea" placeholder="A clear, complete answer.">'+esc(card?card.a:'')+'</textarea></div>'+
      (card?'<label class="check"><input type="checkbox" id="cardSuspended"'+(card.suspended?' checked':'')+'> Suspend this card from sessions</label>':'<p class="modal-note">Tip: write the smallest question that still tests the idea.</p>')+
    '</div>'+
    '<div class="modal-foot"><div class="left">'+(card?'<button class="btn danger sm" id="cardDelete">'+icon('trash')+'Delete</button>':'<span class="modal-note">Ctrl + Enter to save</span>')+'</div>'+
    '<div class="right"><button class="btn" data-close="1">Cancel</button><button class="btn primary" id="cardSave">'+(card?'Save changes':'Add card')+'</button></div></div>',
    {label:card?'Edit card':'New card'}
  );
  const saveBtn=$('#cardSave');
  if(!saveBtn)return;
  const commit=()=>{
    const q=$('#cardQ').value.trim();
    const a=$('#cardA').value.trim();
    const dest=$('#cardDeck').value;
    if(!q||!a){toast('A card needs both a question and an answer.','error');return;}
    if(card){
      card.q=q;card.a=a;card.deckId=dest;
      const box=$('#cardSuspended');
      if(box)card.suspended=box.checked;
    }else{
      const id=uid();
      state.cards[id]={id,deckId:dest,q,a,due:startOfDay(),interval:0,ease:2.3,reps:0,lapses:0,seen:0,correct:0,suspended:false,created:Date.now()};
    }
    save(true);

function download(name,text,mime){
  const blob=new Blob([text],{type:mime||'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportJSON(){
  const data={app:'Atrium',version:1,exported:new Date().toISOString(),decks:state.decks,cards:state.cards,settings:state.settings,stats:state.stats};
  download('atrium-'+ymd()+'.json',JSON.stringify(data,null,2));
  toast('JSON backup exported.');
}
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
function exportCSV(){
  const rows=[['deck','question','answer','due','interval','ease','reps','lapses','seen','correct','suspended']];
  allCards().forEach(c=>{
    rows.push([deckName(c),c.q,c.a,new Date(c.due).toISOString(),c.interval,c.ease,c.reps||0,c.lapses||0,c.seen||0,c.correct||0,c.suspended?1:0]);
  });
  download('atrium-cards-'+ymd()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
  toast('CSV exported.');
}
function exportDeckCSV(id){
  const deck=state.decks[id];
  if(!deck)return;
  const rows=[['question','answer','due','interval','ease','reps','lapses','seen','correct','suspended']];
  deckCards(id).forEach(c=>{
    rows.push([c.q,c.a,new Date(c.due).toISOString(),c.interval,c.ease,c.reps||0,c.lapses||0,c.seen||0,c.correct||0,c.suspended?1:0]);
  });
  const safe=deck.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'deck';
  download('atrium-'+safe+'-'+ymd()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
  toast('Deck exported.');
}

function findOrCreateDeck(name,meta){
  const clean=String(name||'').trim();
  if(!clean)return null;
  const found=Object.values(state.decks).find(d=>d.name.toLowerCase()===clean.toLowerCase());
  if(found)return found;
  const id=uid();
  const color=meta&&DECK_COLORS.includes(meta.color)?meta.color:DECK_COLORS[Object.keys(state.decks).length%DECK_COLORS.length];
  const deck={id,name:clean,note:(meta&&String(meta.note||'').trim())||'Imported deck.',color,created:Date.now()};
  state.decks[id]=deck;
  return deck;
}
function openImport(){
  const deckOptions=Object.values(state.decks).map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('');
  openModal(
    modalHead('Import','A JSON backup, a CSV, or notes pasted as Q: and A: lines. Nothing leaves this device.','upload')+
    '<div class="modal-body">'+
      '<label class="drop" id="dropZone" for="importFile" role="button" tabindex="0" aria-label="Choose a file to import">'+
        icon('upload')+'<b>Choose a file or drop it here</b>'+
        '<small>JSON backup · CSV with question and answer columns · plain text notes</small>'+
        '<span class="drop-btn">'+icon('upload','sm')+'Choose file</span>'+
        '<input type="file" id="importFile" class="file-input" accept=".json,.csv,.txt,.tsv,application/json,text/csv,text/plain,text/tab-separated-values">'+
      '</label>'+
      '<div class="file-note hide" id="fileNote" role="status" aria-live="polite"></div>'+
      '<div class="field"><label for="importText">Or paste notes <span>Q: / A: lines, term — definition, or a JSON backup</span></label><textarea id="importText" class="textarea" placeholder="Q: What is diffusion?&#10;A: Particles spreading from high to low concentration."></textarea></div>'+
      '<div class="field"><label for="importDeck">Deck for unassigned cards</label><select id="importDeck" class="select"><option value="__new">A new deck named “Imported”</option>'+deckOptions+'</select></div>'+
      '<div id="importPreview"></div>'+
    '</div>'+
    '<div class="modal-foot"><div class="left"><button class="btn ghost sm" data-act="starter">'+icon('refresh')+'Load starter</button></div>'+
    '<div class="right"><button class="btn" data-close="1">Cancel</button><button class="btn primary" id="importGo">'+icon('upload')+'Import cards</button></div></div>',
    {label:'Import',wide:true}
  );
  let parsed=null;
  let lastFile=null;
  const fileInput=$('#importFile');
  const drop=$('#dropZone');
  const text=$('#importText');
  const go=$('#importGo');

  if(drop&&fileInput){
    // The label opens the picker natively; this only adds keyboard support and drag-and-drop.
    drop.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker();}
    });
    ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>{
      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f)readFile(f);
    });
    fileInput.addEventListener('change',()=>{
      const f=fileInput.files&&fileInput.files[0];
      if(f)readFile(f);
    });
  }
  if(text)text.addEventListener('input',()=>{
    const value=text.value.trim();
    if(!value){parsed=null;if(!lastFile)setNote(null);}
    else{parsed=parseAnyImport(value);lastFile=null;setNote(null);}
    preview();
  });
  if(go)go.addEventListener('click',commitImport);

  function openPicker(){
    if(!fileInput)return;
    // Clearing the value means choosing the same file again still fires change.
    try{fileInput.value='';}catch(e){}
    fileInput.click();
  }
  function setNote(name,msg,isError){
    const box=$('#fileNote');
    if(!box)return;
    if(!name&&!msg){box.className='file-note hide';box.innerHTML='';return;}
    box.className='file-note'+(isError?' error':'');
    box.innerHTML=icon(isError?'x':'check')+'<div>'+(name?'<b>'+esc(name)+'</b>':'')+(msg?(name?' — ':'')+esc(msg):'')+'</div>';
  }
  function readFile(file){
    const reader=new FileReader();
    reader.onload=()=>{
      const value=String(reader.result||'');
      let items=null;
      const isJson=/\.json$/i.test(file.name)||/^\s*[\[{]/.test(value);
      if(isJson){
        try{items=parseJSONData(JSON.parse(value));}
        catch(e){parsed=null;lastFile=file.name;setNote(file.name,'That file is not valid JSON.',true);preview();return;}
      }else{
        items=parseAnyImport(value);
      }
      parsed=items&&items.length?items:null;
      lastFile=file.name;
      if(parsed)setNote(file.name,plural(parsed.length,'card')+' ready to import.');
      else setNote(file.name,'No cards were found. Check the columns or Q:/A: formatting.',true);
      preview();
    };
    reader.onerror=()=>{parsed=null;lastFile=file.name;setNote(file.name,'That file could not be read.',true);preview();};
    reader.readAsText(file);
  }
  function preview(){
    const box=$('#importPreview');
    if(go){
      const n=parsed?parsed.length:0;
      go.innerHTML=icon('upload')+(n?'Import '+plural(n,'card'):'Import cards');
    }
    if(!box)return;
    if(!parsed||!parsed.length){box.innerHTML='';return;}
    box.innerHTML='<div class="field"><span class="label">Preview <span>'+plural(parsed.length,'card')+' found</span></span>'+
      '<div class="preview-list">'+parsed.slice(0,8).map(it=>'<div class="preview-row"><b>'+esc(trunc(it.q,110))+'</b><span>'+esc(trunc(it.a||'No answer',110))+'</span></div>').join('')+
      (parsed.length>8?'<div class="preview-row"><span>…and '+(parsed.length-8)+' more</span></div>':'')+'</div></div>';
  }
  function commitImport(){
    const typed=text?text.value.trim():'';
    let items=parsed;
    if((!items||!items.length)&&typed)items=parseAnyImport(typed);
    if(!items||!items.length){
      if(typed){toast('No cards could be read from that text. Use Q: and A: lines.','error');return;}
      openPicker();
      return;
    }
    const selected=$('#importDeck').value;
    let fallback=selected==='__new'?null:state.decks[selected];
    if(!fallback&&items.some(it=>!it.deck))fallback=findOrCreateDeck('Imported');
    let added=0;
    const touched=new Set();
    items.forEach(it=>{
      const dest=it.deck?findOrCreateDeck(it.deck,it.deckMeta):fallback;
      if(!dest)return;
      const src=it.src||{};
      const id=uid();
      state.cards[id]={
        id,deckId:dest.id,q:it.q,a:it.a,
        due:src.due?(Number(src.due)||Date.parse(src.due)||startOfDay()):startOfDay(),
        interval:Number(src.interval)||0,
        ease:Number(src.ease)||2.3,
        reps:Number(src.reps)||0,
        lapses:Number(src.lapses)||0,
        seen:Number(src.seen)||0,
        correct:Number(src.correct)||0,
        suspended:!!src.suspended,
        created:Number(src.created)||Date.now()
      };
      added++;touched.add(dest.id);
    });
    if(!added){toast('No cards could be read from that.','error');return;}
    state=normalize(state);
    save(true);
    closeModal();
    toast(plural(added,'card')+' imported.');
    if(touched.size===1)location.hash='#/deck/'+encodeURIComponent(Array.from(touched)[0]);
    else location.hash='#/library';
    route();
  }
  preview();
}
function parseAnyImport(text){
  const s=String(text==null?'':text).trim();
  if(/^[\[{]/.test(s)){
    try{const items=parseJSONData(JSON.parse(s));if(items.length)return items;}catch(e){}
  }
  return looksLikeCSV(s)?parseCSVItems(s):parseImportText(s);
}
function looksLikeCSV(text){
  const first=(String(text).split(/\r?\n/)[0]||'').trim();
  if(!first||!first.includes(','))return false;
  return /question|answer|front|back|term|definition|^"?q"?\s*,/i.test(first)||first.split(',').length>=3;
}
function parseCSV(text){
  const rows=[];let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQuotes){
      if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}
      else field+=ch;
    }else if(ch==='"'){inQuotes=true;}
    else if(ch===','){row.push(field);field='';}
    else if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';}
    else if(ch!=='\r'){field+=ch;}
  }
  row.push(field);
  if(row.some(v=>v!==''))rows.push(row);
  return rows;
}
function parseCSVItems(text){
  const rows=parseCSV(text);
  if(!rows.length)return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const idx=(...names)=>head.findIndex(h=>names.includes(h));
  let qi=idx('question','q','front','term');
  let ai=idx('answer','a','back','definition');
  let di=idx('deck','decks','bed');
  let start=1;
  if(qi<0||ai<0){
    if(head.length>=3&&!['question','q','front','term'].includes(head[0])){di=0;qi=1;ai=2;}
    else{qi=0;ai=1;di=-1;}
    start=0;
  }
  const dueCol=idx('due'),intCol=idx('interval'),easeCol=idx('ease'),repsCol=idx('reps'),lapseCol=idx('lapses'),seenCol=idx('seen'),corrCol=idx('correct'),suspCol=idx('suspended');
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r.length)continue;
    const q=(r[qi]||'').trim();
    const a=(r[ai]||'').trim();
    if(!q||!a)continue;
    const src={};
    if(dueCol>=0&&r[dueCol]){const t=Date.parse(r[dueCol]);if(t)src.due=t;}
    if(intCol>=0)src.interval=parseFloat(r[intCol])||0;
    if(easeCol>=0)src.ease=parseFloat(r[easeCol])||2.3;
    if(repsCol>=0)src.reps=parseInt(r[repsCol],10)||0;
    if(lapseCol>=0)src.lapses=parseInt(r[lapseCol],10)||0;
    if(seenCol>=0)src.seen=parseInt(r[seenCol],10)||0;
    if(corrCol>=0)src.correct=parseInt(r[corrCol],10)||0;
    if(suspCol>=0)src.suspended=/^(1|true|yes)$/i.test((r[suspCol]||'').trim());
    out.push({q,a,deck:di>=0?((r[di]||'').trim()||null):null,src:Object.keys(src).length?src:undefined});
  }
  return out;
}
function parseJSONData(d){
  if(!d||typeof d!=='object')return [];
  const out=[];
  const decks=toMap(d.decks||d.beds);
  const push=(c,deckName,deckMeta)=>{
    if(!c||typeof c!=='object')return;
    const q=c.q!=null?c.q:(c.question!=null?c.question:(c.front!=null?c.front:(c.term!=null?c.term:'')));
    const a=c.a!=null?c.a:(c.answer!=null?c.answer:(c.back!=null?c.back:(c.definition!=null?c.definition:'')));
    if(!String(q).trim())return;
    out.push({q:String(q),a:String(a==null?'':a),deck:deckName||null,deckMeta:deckMeta||null,src:c});
  };
  if(d.cards&&!Array.isArray(d.cards)&&typeof d.cards==='object'){
    Object.values(d.cards).forEach(c=>{
      const ref=(c&&c.deckId&&decks[c.deckId])||(c&&c.bedId&&decks[c.bedId]);
      push(c,ref?ref.name:(c&&(c.deck||c.bed))||null,ref||null);
    });
    return out;
  }
  if(Array.isArray(d.cards)){d.cards.forEach(c=>push(c,c&&(c.deck||c.bed)));return out;}
  if(Array.isArray(d)){d.forEach(c=>push(c,c&&(c.deck||c.bed)));return out;}
  return out;
}
function parseImportText(text){
  const lines=String(text).replace(/\r/g,'').split('\n');
  const out=[];
  let cur=null;
  let heading=null;
  const flush=()=>{
    if(cur&&cur.q.trim()&&cur.a.trim())out.push({q:cur.q.trim(),a:cur.a.trim(),deck:cur.deck||heading||null});
    cur=null;
  };
  for(const raw of lines){
    const line=raw.trim();
    if(!line)continue;
    if(/^q\s*[:.)-]\s*/i.test(line)){
      flush();
      cur={q:line.replace(/^q\s*[:.)-]\s*/i,''),a:'',deck:null};
    }else if(/^a\s*[:.)-]\s*/i.test(line)){
      if(cur)cur.a=line.replace(/^a\s*[:.)-]\s*/i,'');
      else cur={q:line.replace(/^a\s*[:.)-]\s*/i,''),a:'',deck:null};
    }else if(/^#\s+/.test(line)||/^\[(.+)\]$/.test(line)){
      flush();
      heading=line.replace(/^#\s+/,'').replace(/^\[|\]$/g,'').trim();
    }else if(/\t/.test(raw)){
      const parts=raw.split('\t');
      const q=parts.shift();const a=parts.join(' ').trim();
      if(q&&a){flush();out.push({q:q.trim(),a,deck:heading||null});}
    }else if(/\s[—–]\s/.test(line)){
      const at=line.search(/\s[—–]\s/);
      const q=line.slice(0,at).trim();
      const a=line.slice(at+3).trim();
      if(q&&a){flush();out.push({q,a,deck:heading||null});}
      else if(cur)cur.a+=(cur.a?' ':'')+line;
    }else if(/^[^:]{1,70}:\s+\S/.test(line)&&!cur){
      const at=line.indexOf(':');
      const q=line.slice(0,at).trim();
      const a=line.slice(at+1).trim();
      if(q&&a)out.push({q,a,deck:heading||null});
    }else if(cur){
      cur.a+=(cur.a?' ':'')+line;
    }
  }
  flush();
  return out.filter(x=>x.q.length>1&&x.a.length>0);
}

document.addEventListener('click',e=>{

  const closer=e.target.closest('[data-close]');
  if(closer){closeModal();return;}
  const rate=e.target.closest('[data-rate]');

  const act=e.target.closest('[data-act]');
  if(!act)return;
  const id=act.dataset.id;
  switch(act.dataset.act){
    case 'theme': toggleTheme(); break;
    case 'palette': openPalette(); break;
    case 'new-card': {
      const r=parseRoute();
      openCardModal(null,act.dataset.deck||(r.name==='deck'?r.id:null));
      break;
    }
    case 'new-deck': openDeckModal(); break;
    case 'start': startSession(null); break;
    case 'start-deck': startSession(id); break;
    case 'study-card': startSession(null,id); break;
    case 'edit-card': openCardModal(id); break;
    case 'toggle-suspend': toggleSuspend(id); break;
    case 'delete-card': deleteCard(id); break;
    case 'edit-deck': openDeckModal(id); break;
    case 'deck-menu': openDeckMenu(id); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import': openImport(); break;
    case 'starter': loadStarter(); break;
    case 'reset-all': resetAll(); break;
    case 'set-theme': setTheme(act.dataset.themeValue); break;
    case 'exit-study': leaveSession(); break;
    case 'reveal': revealAnswer(); break;
    case 'exit-summary': finishSession(); break;
    case 'summary-done': finishToToday(); break;
    case 'go-library': location.hash='#/library'; break;
    case 'go-today': location.hash='#/today'; break;
    case 'skip': e.preventDefault(); const main=$('#view'); if(main)main.focus({preventScroll:true}); break;
  }
});

document.addEventListener('keydown',e=>{
  if(paletteEl)return;
  if(e.key==='Escape'){
    if($('#modalRoot .scrim')){e.preventDefault();closeModal();return;}
    if(session){e.preventDefault();leaveSession();return;}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(!$('#modalRoot .scrim')&&!session)openPalette();
    return;
  }
  if(e.key==='Tab'&&$('#modalRoot .scrim')){
    const box=$('#modalRoot .modal');
    if(!box)return;
    const focusable=$$('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])',box).filter(el=>el.offsetParent!==null);
    if(!focusable.length)return;
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    return;
  }
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if(typing)return;
  if($('#modalRoot .scrim'))return;
  if(session){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();revealAnswer();return;}
    if(['1','2','3','4'].includes(e.key)){e.preventDefault();rateCard(RATINGS[Number(e.key)-1]);return;}
    return;
  }
  if(e.key.toLowerCase()==='s'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();startSession(null);}
});

/* ============================================================
   Boot
   ============================================================ */
function boot(){
  const stored=load();
  state=stored||starterState();
  if(!stored)save(true);
  applyTheme();
  route();
  window.addEventListener('hashchange',()=>{
    if(session)closeSession();
    route({focus:false});
  });
  window.addEventListener('beforeunload',()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  });
  const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener){
    mq.addEventListener('change',()=>{
      if(state.settings.theme==='auto'){
        applyTheme();
        if(parseRoute().name==='settings')route({keepScroll:true});
      }
    });
  }
}
boot();
</script>
