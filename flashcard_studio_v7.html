/* ================================ PARSER ================================= */
function parseCards(raw){
  const text=String(raw||'').replace(/\r/g,'').replace(/<br\s*\/?>/gi,'\n').replace(/&nbsp;/gi,' ').trim();
  if(!text) return [];
  const out=[];
  const add=(q,a)=>{
    q=String(q||'').trim().replace(/^["']+|["']+$/g,'').replace(/^\d+[.)]\s+/,'').trim();
    a=String(a||'').trim().replace(/^["']+|["']+$/g,'').trim();
    if(!q) return;
    if(!a&&!/\{\{[^}]+\}\}/.test(q)) return;
    if(!a) a=[...q.matchAll(/\{\{([^}]+)\}\}/g)].map(m=>m[1]).join(' · ');
    out.push({q,a});
  };
  const QRE=/^\s*(?:q(?:uestion)?)\s*[:\-]\s*/i;
  const ARE=/^\s*(?:a(?:nswer)?)\s*[:\-]\s*/i;
  const DELIMS=['\t','::',' || ','||',' | ','|'];
  const splitDelim=l=>{
    for(const sep of DELIMS){const at=l.indexOf(sep);if(at>=0)return [l.slice(0,at),l.slice(at+sep.length)]}
    return null;
  };
  const rawLines=text.split('\n');
  const clozeLines=[];
  const lines=[];
  rawLines.forEach(l=>{
    const t=l.trim();
    if(!t){lines.push(l);return}
    if(/\{\{[^}]+\}\}/.test(t)&&!QRE.test(t)&&!ARE.test(t)&&!splitDelim(t)){
      clozeLines.push(t);return;
    }
    lines.push(l);
  });
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;
    if(QRE.test(line)){
      let q=line.replace(QRE,'');
      let answer=null;
      const same=q.match(/^(.*?)\s+a(?:nswer)?\s*[:\-]\s*([\s\S]*)$/i);
      if(same){q=same[1];answer=same[2]}
      let j=i+1;
      if(answer===null){
        while(j<lines.length){
          const l=lines[j].trim();
          if(!l) break;
          if(QRE.test(l)) break;
          if(ARE.test(l)){
            answer=l.replace(ARE,'');
            j++;
            while(j<lines.length){
              const cont=lines[j].trim();
              if(!cont||QRE.test(cont)||ARE.test(cont)||splitDelim(cont)) break;
              answer+='\n'+cont;j++;
            }
            break;
          }
          if(splitDelim(l)) break;
          q+='\n'+l;j++;
        }
      }else{
        while(j<lines.length){
          const cont=lines[j].trim();
          if(!cont||QRE.test(cont)||ARE.test(cont)||splitDelim(cont)) break;
          answer+='\n'+cont;j++;
        }
      }
      if(answer!==null) add(q,answer);
      else if(/\{\{[^}]+\}\}/.test(q)) add(q,'');
      i=j-1;
      continue;
    }
    const pair=splitDelim(line);
    if(pair){add(pair[0],pair[1]);continue}
    if(/\{\{[^}]+\}\}/.test(line)){add(line,'');continue}
    // "Term: definition" only when the right side looks like a definition
    if(/^[^:]{2,90}:\s+\S/.test(line)&&!/^\s*(?:q|a|question|answer|note|hint)\s*:/i.test(line)&&!/^https?:\/\//i.test(line)){
      const at=line.indexOf(':');
      if(at>0) add(line.slice(0,at),line.slice(at+1));
    }
  }
  if(!out.length&&!clozeLines.length){
    text.split(/\n\s*\n/).forEach(block=>{
      const ls=block.split('\n').map(l=>l.trim()).filter(Boolean);
      if(ls.length>=2) add(ls[0],ls.slice(1).join(' '));
    });
  }
  clozeLines.forEach(l=>add(l,''));
  const seen=new Set();
  return out.filter(c=>{
    const k=norm(c.q)+'\u0000'+norm(c.a);
    if(seen.has(k)) return false;
    seen.add(k);return true;
  }).map(c=>newCard(c.q,c.a));
}

async function deleteCardById(id){

    const ok=await askConfirm({title:'Delete this card?',body:'The card and its review history will be removed. You can undo this right after.',label:'Delete card'});
    if(!ok) return;
  }
  const [removed]=deck.cards.splice(idx,1);
  deck.updatedAt=Date.now();
  pushUndo('Card deleted',()=>{deck.cards.splice(idx,0,removed);deck.updatedAt=Date.now();persist();rerenderAfterData()});

    currentSession.ids=currentSession.ids.filter(x=>x!==id);
    if(currentSession.idx>=currentSession.ids.length) currentSession.idx=Math.max(0,currentSession.ids.length-1);
  }
  persist();
  closeModal();
  rerenderAfterData();
  toast('Card deleted.',{action:{label:'Undo',run:()=>undoLast()}});
}
function pushUndo(label,fn){
  undoStack.push({label,fn,at:Date.now()});
  if(undoStack.length>30) undoStack.shift();
}
function undoLast(){
  const item=undoStack.pop();
  if(!item) return toast('Nothing to undo.',{type:'info'});
  try{item.fn();toast(`Undone: ${item.label}.`,{type:'info'})}catch(e){toast('Could not undo that.',{type:'error'})}
}
function rerenderAfterData(){
  const r=parseRoute();
  if(r.name==='study'&&currentSession) renderStudy();

  renderChrome();
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(quoted){
      if(ch==='"'&&next==='"'){cell+='"';i++}
      else if(ch==='"'){quoted=false}
      else cell+=ch;
    }else{
      if(ch==='"') quoted=true;
      else if(ch===','){row.push(cell);cell=''}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
async function handleImportFile(file){
  if(!file) return;
  try{
    const text=await file.text();
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    let imported=0;
    if(ext==='json'){
      const data=JSON.parse(text);
      const decks=data.decks||data;
      const entries=Array.isArray(decks)?decks.map(d=>[d.name,d]):Object.entries(decks||{});
      if(!entries.length) throw new Error('No decks found');
      for(const [key,d] of entries){
        if(!d||!Array.isArray(d.cards)) continue;
        const name=d.name||key||'Imported deck';
        if(allDecks().some(x=>x.name.toLowerCase()===String(name).toLowerCase())){
          const ok=await askConfirm({title:'A deck with this name exists',body:`“${name}” is already in your library. Importing will replace it.`,label:'Replace'});
          if(!ok) continue;
          const existing=allDecks().find(x=>x.name.toLowerCase()===String(name).toLowerCase());
          delete state.decks[existing.id];
        }
        const deck=normalizeDeck(uid(),d,name);
        state.decks[deck.id]=deck; imported++;
      }
      if(data.settings) state.settings=Object.assign(state.settings,data.settings);
    }else if(ext==='csv'){
      const rows=parseCSV(text);
      const header=rows[0]?.map(x=>String(x).toLowerCase().trim());
      const looksHeader=header&&(header.includes('question')||header.includes('q')||header.includes('front')||header.includes('answer')||header.includes('a')||header.includes('back'));
      const body=looksHeader?rows.slice(1):rows;
      const deck=newDeck({name:file.name.replace(/\.[^.]+$/,'')||'Imported deck',description:'Imported from '+file.name,icon:'📥',tags:['imported']});
      body.forEach(r=>{
        if(r.length>=2&&String(r[0]).trim()&&String(r[1]).trim()) deck.cards.push(newCard(String(r[0]).trim(),String(r[1]).trim()));
      });
      if(!deck.cards.length) throw new Error('No rows');
      state.decks[deck.id]=deck; imported=1;
    }else{
      const cards=parseCards(text);
      if(!cards.length) throw new Error('No cards');
      const deck=newDeck({name:file.name.replace(/\.[^.]+$/,'')||'Imported deck',description:'Imported from '+file.name,icon:'📥',tags:['imported']});
      deck.cards=cards;
      state.decks[deck.id]=deck; imported=1;
    }
    if(!imported) throw new Error('Nothing imported');
    persist(true);closeModal();renderLibrary();renderChrome();
    toast(`Imported ${plural(imported,'deck','decks')}.`);
    burst(55);beep('complete');
  }catch(e){
    console.warn(e);
    toast('That file could not be imported. Check the format.',{type:'error'});
  }
}

const MODE_LABELS={smart:'Smart review',cram:'Cram',quiz:'Multiple choice',typed:'Type it out',sprint:'60s sprint'};
let quizTimer=null;

function updateStreak(day){
  const st=state.stats;
  if(st.lastStudy===day) return;
  const yesterday=dateKey(addDays(new Date(),-1));
  st.streak=st.lastStudy===yesterday?st.streak+1:1;
  st.lastStudy=day;
  if(st.streak>st.bestStreak) st.bestStreak=st.streak;
}
function recordReview(card,rating){
  const before=levelInfo().level;
  scheduleCard(card,rating);
  const st=state.stats;
  const xp=XP[rating]||2;
  st.xp+=xp;
  st.totalReviews++;
  if(rating==='good'||rating==='easy') st.totalCorrect++;
  const key=dateKey();
  const day=st.days[key]||(st.days[key]={r:0,c:0});
  day.r++;if(rating==='good'||rating==='easy') day.c++;
  updateStreak(key);
  if(currentSession){
    st.modes[currentSession.mode]=true;
    currentSession.streak=rating==='good'||rating==='easy'?(currentSession.streak||0)+1:0;
    if(currentSession.streak>=10) unlockAchievement('perfect10');
  }
  const hour=new Date().getHours();
  if(hour<5) unlockAchievement('nightowl');
  if(hour<7) unlockAchievement('earlybird');
  checkAchievements();
  const after=levelInfo().level;
  if(after>before){setTimeout(()=>{toast(`Level ${after} reached! Keep going.`,'success');burst(65);beep('unlock')},250)}
  beep(rating==='again'?'wrong':'correct');
  return xp;
}
function buildQueue(deck,mode){
  const cards=deck.cards.filter(c=>!c.suspended);
  if(mode==='smart'){
    const due=dueCards(deck).slice().sort((a,b)=>a.srs.due-b.srs.due);
    const fresh=shuffle(newCards(deck).slice()).slice(0,Math.max(1,state.settings.newPerDay||20));
    const q=[...fresh,...due];
    return q.length?q:shuffle([...cards]);
  }
  if(mode==='cram') return shuffle([...cards]);
  if(mode==='quiz') return shuffle(cards.filter(c=>answerOf(c).trim())).slice(0,20);
  if(mode==='typed') return shuffle([...cards]);
  if(mode==='sprint') return shuffle(cards.filter(c=>answerOf(c).trim()));
  return [...cards];
}

function makeQuizOptions(card){
  const deck=sessionDeck();
  const correct=answerOf(card);
  const pool=[...new Set((deck?.cards||[]).filter(c=>c.id!==card.id).map(answerOf).filter(a=>a&&norm(a)!==norm(correct)))];
  shuffle(pool);
  const opts=[correct,...pool.slice(0,3)];
  const fillers=['None of the above','All of the above','Not enough information'];
  let f=0;
  while(opts.length<4&&f<fillers.length){if(!opts.includes(fillers[f]))opts.push(fillers[f]);f++}
  return shuffle(opts);

      <div class="row"><span class="study-badge">${icon('dice')} Match game</span><span class="timer-pill">${icon('timer')} <span id="matchClock">${m.seconds}s</span></span><span class="timer-pill">${icon('swap')} <span id="matchMoves">${m.moves}</span> moves</span></div>
      <button class="btn btn-sm btn-ghost" data-act="start-match" data-id="${deck.id}">${icon('refresh')} Restart</button>
    </div>
    <p class="muted small" style="text-align:center;margin:0 auto 14px;max-width:540px">Pick a term, then its matching definition. Clear all ${m.pairs.length} pairs in as few moves as you can.</p>
    <div class="match-board" id="matchBoard">${matchTilesMarkup()}</div>
    <div class="study-foot"><span>${icon('sparkles')} Matching pairs also counts toward your XP and achievements.</span><button class="btn btn-sm btn-ghost" data-act="back-to-deck">Exit game</button></div>
  </div>`;
}
function matchTilesMarkup(){
  const m=currentMatch;
  return m.tiles.map((t,i)=>{
    const matched=m.matched.has(i);
    const sel=m.selected===i;
    const wrong=m.wrong.includes(i);
    return `<button class="tile ${matched?'matched':''} ${sel?'sel':''} ${wrong?'wrong':''}" data-act="tile" data-i="${i}" ${matched?'disabled':''}>
      <span class="side-tag">${t.side==='q'?'Term':'Definition'}</span>
      <span>${md(t.text)}</span>
    </button>`;
  }).join('');
}
function pickTile(i){
  const m=currentMatch;
  if(!m||m.done||m.matched.has(i)) return;
  if(m.wrong.length) return;
  if(m.selected===null){
    m.selected=i;beep('click');renderMatchBoard();return;
  }
  if(m.selected===i){m.selected=null;renderMatchBoard();return}
  const first=m.tiles[m.selected],second=m.tiles[i];
  m.moves++;
  if(first.key===second.key&&first.side!==second.side){
    m.matched.add(m.selected);m.matched.add(i);
    m.selected=null;
    beep('correct');
    renderMatchBoard();
    if(m.matched.size===m.tiles.length) finishMatch();
  }else{
    m.wrong=[m.selected,i];
    m.selected=null;
    beep('wrong');
    renderMatchBoard();
    setTimeout(()=>{if(!currentMatch)return;currentMatch.wrong=[];renderMatchBoard()},480);
  }
}
function renderMatchBoard(){
  const board=$('#matchBoard');
  if(board) board.innerHTML=matchTilesMarkup();
  const moves=$('#matchMoves');
  if(moves&&currentMatch) moves.textContent=currentMatch.moves;
}
function finishMatch(){
  const m=currentMatch;
  if(!m||m.done) return;
  m.done=true;
  m.seconds=Math.max(1,Math.floor((Date.now()-m.start)/1000));
  stopMatchTimer();
  m.xp=Math.max(25,Math.min(120,100-Math.max(0,m.seconds-30)*2-Math.max(0,m.moves-m.pairs.length)*3));
  state.stats.xp+=m.xp;
  state.stats.sessions++;
  state.stats.modes['match']=true;
  checkAchievements();
  persist(true);
  burst(120);beep('complete');
  renderMatch();
  renderChrome();
}

function lastNDays(n){
  const out=[];
  const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=addDays(now,-i),key=dateKey(d),s=state.stats.days[key]||{r:0,c:0};
    out.push({key,date:d,r:s.r||0,c:s.c||0});
  }
  return out;
}
function heatmapMarkup(){
  const end=new Date();
  const start=addDays(end,-181);
  start.setDate(start.getDate()-start.getDay());
  const cells=[];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const key=dateKey(d),s=state.stats.days[key]||{r:0};
    const r=s.r||0;
    const lvl=r===0?0:r<5?1:r<10?2:r<20?3:4;
    cells.push(`<div class="hm-cell" data-l="${lvl}" title="${key} · ${plural(r,'review','reviews')}"></div>`);
  }
  return `<div class="heatmap-wrap"><div class="heatmap">${cells.join('')}</div></div>
    <div class="heatmap-foot"><span>Less</span><div class="hm-cell" data-l="0"></div><div class="hm-cell" data-l="1"></div><div class="hm-cell" data-l="2"></div><div class="hm-cell" data-l="3"></div><div class="hm-cell" data-l="4"></div><span>More</span></div>`;
}
function activityChartMarkup(){
  const days=lastNDays(30);
  const maxR=Math.max(1,...days.map(d=>d.r));
  const W=680,H=210,pL=34,pR=14,pT=16,pB=28;
  const innerW=W-pL-pR,innerH=H-pT-pB;
  const step=innerW/30;
  const barW=step*.58;
  const barX=i=>pL+i*step+(step-barW)/2;
  const yR=v=>pT+innerH-(v/maxR)*innerH;
  const lines=[0,.25,.5,.75,1].map(p=>{
    const y=pT+innerH-p*innerH;
    return `<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".08" stroke-dasharray="3 5"/><text x="${pL-7}" y="${y+3}" text-anchor="end" font-size="8.5" fill="currentColor" fill-opacity=".45">${Math.round(p*maxR)}</text>`;
  }).join('');
  const bars=days.map((d,i)=>{
    const h=d.r?Math.max(2,(d.r/maxR)*innerH):0;
    return `<rect x="${barX(i)}" y="${pT+innerH-h}" width="${barW}" height="${h}" rx="2" fill="url(#barGrad)" opacity="${d.r?.9:.25}"><title>${d.key}: ${d.r} reviews</title></rect>`;
  }).join('');
  const points=[];
  days.forEach((d,i)=>{if(d.r) points.push([pL+i*step+step/2,pT+innerH-(d.c/d.r)*innerH])});
  const line=points.length?`<polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`:'';
  const dots=points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.4" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="1.6"/>`).join('');
  const first=days[0].date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const last=days[days.length-1].date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reviews and accuracy over the last 30 days">
    <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".25"/></linearGradient></defs>
    ${lines}${bars}${line}${dots}
    <text x="${pL}" y="${H-8}" font-size="9" fill="currentColor" fill-opacity=".45">${first}</text>
    <text x="${W-pR}" y="${H-8}" text-anchor="end" font-size="9" fill="currentColor" fill-opacity=".45">${last}</text>
  </svg>`;
}

function forecastMarkup(){

/* =============================== SYNC FILE ============================== */
const SYNC_DB='flashcardStudioSyncV7',SYNC_STORE='handles';
let syncHandle=null,syncTimer=null;
function openSyncDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(SYNC_DB,1);
    r.onupgradeneeded=()=>{try{r.result.createObjectStore(SYNC_STORE)}catch(e){}};
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function saveHandle(h){
  const db=await openSyncDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(SYNC_STORE,'readwrite');
    tx.objectStore(SYNC_STORE).put(h,'syncFile');
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
async function getHandle(){
  try{
    const db=await openSyncDB();
    return await new Promise((resolve,reject)=>{
      const r=db.transaction(SYNC_STORE).objectStore(SYNC_STORE).get('syncFile');
      r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);
    });
  }catch(e){return null}
}
async function canUseHandle(h,write=false){
  if(!h) return false;
  const opts={mode:write?'readwrite':'read'};
  try{
    if((await h.queryPermission(opts))==='granted') return true;
    return (await h.requestPermission(opts))==='granted';
  }catch(e){return false}
}
function syncPayload(){
  return {app:'Flashcard Studio',version:7,syncedAt:new Date().toISOString(),decks:state.decks,settings:state.settings,stats:state.stats};
}
function syncStatus(msg,error=false){
  const el=$('#syncStatus');
  if(el){el.textContent=msg;el.style.color=error?'var(--red)':''}
}
async function writeSyncFile(silent=true){
  if(!syncHandle) return false;
  try{
    if(!await canUseHandle(syncHandle,true)){syncStatus('Sync file needs permission. Click Connect.',true);return false}
    const w=await syncHandle.createWritable();
    await w.write(JSON.stringify(syncPayload(),null,2));
    await w.close();
    syncStatus('Synced just now · '+syncHandle.name);
    if(!silent) toast('Synced to '+syncHandle.name);
    return true;
  }catch(e){
    console.warn(e);syncStatus('Could not write the sync file.',true);
    if(!silent) toast('Sync failed.',{type:'error'});
    return false;
  }
}
function scheduleFileSync(){
  if(!syncHandle) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>writeSyncFile(true),1200);
}
async function readSyncFile(h){
  const f=await h.getFile();
  const text=await f.text();
  if(!text.trim()) return false;
  const data=JSON.parse(text);
  mergeIncoming(data);
  return true;
}
function mergeIncoming(data){
  if(!data||typeof data!=='object') return;
  const incoming=data.decks||{};
  Object.entries(incoming).forEach(([id,d])=>{
    if(!d||!Array.isArray(d.cards)) return;
    const deck=normalizeDeck(id,d,d.name||'Imported deck');
    const cur=state.decks[id];
    if(!cur||deck.updatedAt>cur.updatedAt) state.decks[id]=deck;
  });
  if(data.stats&&typeof data.stats==='object'){
    state.stats.xp=Math.max(state.stats.xp,Number(data.stats.xp)||0);
    state.stats.bestStreak=Math.max(state.stats.bestStreak,Number(data.stats.bestStreak)||0);
    Object.entries(data.stats.days||{}).forEach(([k,v])=>{if(v&&v.r){const cur=state.stats.days[k]||{r:0,c:0};cur.r=Math.max(cur.r,v.r||0);cur.c=Math.max(cur.c,v.c||0);state.stats.days[k]=cur}});
    Object.assign(state.stats.achievements,data.stats.achievements||{});
  }
  persist(true);
  rerenderAfterData();
}
async function connectSync(){
  if(!window.showSaveFilePicker){
    toast('File sync is not supported in this browser. Use Chrome or Edge, or stick to JSON export.',{type:'error'});
    return;
  }
  try{
    syncHandle=await window.showSaveFilePicker({
      suggestedName:'flashcard-studio-sync.json',
      types:[{description:'Flashcard Studio sync',accept:{'application/json':['.json']}}]
    });
    await saveHandle(syncHandle);
    try{await readSyncFile(syncHandle)}catch(e){}
    await writeSyncFile(true);
    renderSettings();renderChrome();
    toast('Sync file connected. Put it in a folder your cloud service backs up.');
  }catch(e){
    if(e&&e.name!=='AbortError') toast('Could not connect the sync file.',{type:'error'});
  }
}
async function restoreSync(){
  syncHandle=await getHandle();
  if(!syncHandle) return;
  try{
    const perm=await syncHandle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      try{await readSyncFile(syncHandle)}catch(e){}
      syncStatus('Sync file remembered · '+syncHandle.name);
    }else{
      syncStatus('Sync file remembered. Reconnect to grant permission.');
    }
  }catch(e){}
}
async function syncNow(){
  if(!syncHandle) return connectSync();
  try{
    if(!await canUseHandle(syncHandle,true)) return;
    await readSyncFile(syncHandle);
    await writeSyncFile(false);
  }catch(e){toast('Could not sync.',{type:'error'})}
}
async function disconnectSync(){
  syncHandle=null;
  try{
    const db=await openSyncDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(SYNC_STORE,'readwrite');tx.objectStore(SYNC_STORE).delete('syncFile');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  }catch(e){}
  renderSettings();toast('Sync file disconnected.',{type:'info'});
}

/* ================================ PALETTE ================================ */
const paletteState={open:false,items:[],idx:0,query:''};
function fuzzyScore(q,text){
  if(!q) return 1;
  const t=text.toLowerCase();
  q=q.toLowerCase();
  const direct=t.indexOf(q);
  if(direct>=0) return 100-direct+(direct===0?30:0);
  let ti=0,score=0,gaps=0;
  for(const ch of q){
    const idx=t.indexOf(ch,ti);
    if(idx<0) return 0;
    score+=idx===ti?4:1;
    if(idx!==ti) gaps++;
    ti=idx+1;
  }
  return score-gaps*.5;
}
function paletteItems(){
  const q=paletteState.query.trim();
  const list=[
    {group:'Actions',label:'New deck',meta:'Build from scratch',icon:'plus',run:()=>openDeckForm()},
    {group:'Actions',label:'Import a backup',meta:'JSON, CSV or text',icon:'upload',run:()=>openImportModal()},
    {group:'Actions',label:'Export everything',meta:'Download JSON',icon:'download',run:()=>exportAll()},
    {group:'Actions',label:'Start smart review',meta:allDueCount()+allNewCount()+' cards ready',icon:'play',run:()=>{const d=bestDeckForReview();if(d)nav('study/'+d.id+'/smart');else toast('Create a deck first.',{type:'info'})}},
    {group:'Actions',label:'Toggle theme',meta:resolvedTheme()==='dark'?'Switch to light':'Switch to dark',icon:resolvedTheme()==='dark'?'sun':'moon',run:()=>setTheme(resolvedTheme()==='dark'?'light':'dark')},
    {group:'Actions',label:'Statistics',meta:'Progress and habits',icon:'chart',run:()=>nav('stats')},
    {group:'Actions',label:'Achievements',meta:unlockedCount()+' unlocked',icon:'trophy',run:()=>nav('badges')},
    {group:'Actions',label:'Settings',meta:'Appearance and data',icon:'settings',run:()=>nav('settings')},
    {group:'Actions',label:'Keyboard shortcuts',meta:'Every key',icon:'keyboard',run:()=>openShortcutsModal()}
  ];
  allDecks().sort((a,b)=>b.updatedAt-a.updatedAt).forEach(d=>{
    const due=dueCards(d).length;
    list.push({group:'Decks',label:'Study '+d.name,meta:due?`${due} due`:`${plural(d.cards.length,'card','cards')}`,icon:'play',run:()=>nav('study/'+d.id+'/smart')});
    list.push({group:'Decks',label:'Open '+d.name,meta:'Deck details',icon:'layers',run:()=>nav('deck/'+d.id)});
  });
  if(q.length>=2){
    let count=0;
    for(const d of allDecks()){
      for(const c of d.cards){
        if(count>=8) break;
        if(!fuzzyScore(q,c.q+' '+c.a)) continue;
        list.push({group:'Cards',label:c.q.slice(0,90),meta:d.name,icon:'card',run:()=>{
          nav('deck/'+d.id);
          setTimeout(()=>{const deck=state.decks[d.id];const card=deck?.cards.find(x=>x.id===c.id);if(card)openCardEditor(card)},180);
        }});
        count++;
      }
      if(count>=8) break;
    }
  }
  if(!q) return list.slice(0,18);
  return list.map(item=>({item,score:Math.max(fuzzyScore(q,item.label),fuzzyScore(q,item.meta||'')*.35)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20).map(x=>x.item);
}
function openPalette(){
  paletteState.open=true;paletteState.query='';paletteState.idx=0;
  const p=$('#palette');p.classList.remove('hidden');
  const input=$('#paletteInput');if(input){input.value='';input.focus()}
  renderPaletteList();
}
function closePalette(){
  paletteState.open=false;
  $('#palette').classList.add('hidden');
}
function renderPaletteList(){
  const el=$('#paletteList');
  if(!el) return;
  const items=paletteItems();
  paletteState.items=items;
  paletteState.idx=clamp(paletteState.idx,0,Math.max(0,items.length-1));
  if(!items.length){
    el.innerHTML='<div class="palette-empty">No matches. Try a deck name, a question, or “new deck”.</div>';
    return;
  }
  let html='',lastGroup='';
  items.forEach((item,i)=>{
    if(item.group!==lastGroup){html+=`<div class="palette-group">${item.group}</div>`;lastGroup=item.group}
    html+=`<button class="palette-item ${i===paletteState.idx?'active':''}" data-act="palette-run" data-i="${i}">${icon(item.icon||'arrow-right')}<span>${esc(item.label)}</span>${item.meta?`<span class="pi-meta">${esc(item.meta)}</span>`:''}</button>`;
  });
  el.innerHTML=html;
  const active=el.querySelector('.palette-item.active');
  if(active) active.scrollIntoView({block:'nearest'});
}
function runPaletteItem(i){
  const item=paletteState.items[i];
  if(!item) return;
  closePalette();
  setTimeout(()=>{try{item.run()}catch(e){console.warn(e)}},30);
}
function openShortcutsModal(){
  openModal(`
    <div class="modal-head"><div><h2>Keyboard shortcuts</h2><p>Move fast, stay in flow.</p></div><button class="iconbtn" data-act="close-modal">${icon('x')}</button></div>
    <div class="keys-grid" style="font-size:.85rem">
      <span><span class="kbd">Ctrl K</span> Command menu</span>
      <span><span class="kbd">Space</span> Flip / show answer</span>
      <span><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span> Rate again → easy</span>
      <span><span class="kbd">←</span><span class="kbd">→</span> Previous / skip</span>
      <span><span class="kbd">A–D</span> Choose quiz option</span>
      <span><span class="kbd">E</span> Edit current card</span>
      <span><span class="kbd">S</span> Read card aloud</span>
      <span><span class="kbd">Esc</span> Exit study or close a dialog</span>
      <span><span class="kbd">Ctrl Z</span> Undo last delete</span>
      <span><span class="kbd">Enter</span> Check typed answer</span>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-act="close-modal">Got it</button></div>
  `,{size:'slim'});
}

/* ================================ THEME ================================= */
function setTheme(theme){
  state.settings.theme=theme;
  persist();
  renderChrome();
  if(parseRoute().name==='settings') renderSettings();
}
function setAccent(accent){
  state.settings.accent=accent;
  persist();
  renderChrome();
  if(parseRoute().name==='settings') renderSettings();
}
function toggleSetting(key){
  state.settings[key]=!state.settings[key];
  persist();
  if(parseRoute().name==='settings') renderSettings();
  if(key==='reduceMotion') renderChrome();
  if(key==='sound'&&state.settings.sound) beep('click');
}

/* ================================ ACTIONS =============================== */
const ACTIONS={
  'palette':()=>openPalette(),
  'toggle-theme':()=>setTheme(resolvedTheme()==='dark'?'light':'dark'),
  'close-modal':()=>closeModal(),
  'modal-confirm':()=>{const r=confirmResolver;confirmResolver=null;closeModal();if(r)r(true)},
  'modal-cancel':()=>{const r=confirmResolver;confirmResolver=null;closeModal();if(r)r(false)},
  'new-deck':()=>openDeckForm(),
  'load-sample':()=>loadSampleDeck(),
  'review-now':()=>{const d=bestDeckForReview();if(d)nav('study/'+d.id+'/smart');else toast('Create a deck first.',{type:'info'})},
  'open-deck':el=>{const d=state.decks[el.dataset.id];if(d)nav('deck/'+d.id)},
  'deck-menu':el=>{const d=state.decks[el.dataset.id];if(d)openDeckMenu(d)},
  'start-session':el=>{const d=currentDeck()||bestDeckForReview();if(!d)return;const mode=el.dataset.mode||'smart';nav('study/'+d.id+'/'+mode)},
  'start-match':el=>{const id=el.dataset.id||currentDeck()?.id;if(id)nav('match/'+id)},
  'back-to-deck':()=>{const d=currentDeck();if(d)nav('deck/'+d.id);else nav('library')},
  'edit-deck':()=>{const d=currentDeck();if(d)openDeckForm(d)},
  'add-card':()=>openCardEditor(null),
  'edit-card':el=>{const d=currentDeck();if(!d)return;const c=d.cards.find(x=>x.id===el.dataset.id);if(c)openCardEditor(c)},
  'delete-card':el=>deleteCardById(el.dataset.id),
  'delete-card-modal':el=>deleteCardById(el.dataset.id),
  'toggle-suspend':el=>{
    const d=currentDeck();const c=d?.cards.find(x=>x.id===el.dataset.id);
    if(!c)return;
    c.suspended=!c.suspended;d.updatedAt=Date.now();persist();
    renderDeck(d);renderChrome();
    toast(c.suspended?'Card suspended — it will be skipped.':'Card resumed.',{type:'info'});
  },
  'filter-tag':el=>{ui.libTag=el.dataset.tag;renderLibrary()},
  'filter-cards':el=>{ui.cardFilter=el.dataset.filter;const d=currentDeck();if(d)renderDeck(d)},
  'reset-lib-filters':()=>{ui.libSearch='';ui.libTag='all';ui.libSort='recent';renderLibrary()},
  'clear-card-filters':()=>{ui.deckSearch='';ui.cardFilter='all';const d=currentDeck();if(d)renderDeck(d)},
  'pick-colour':el=>{$$('.colour-opt',el.parentElement).forEach(b=>b.classList.remove('active'));el.classList.add('active')},
  'pick-icon':el=>{$$('.emoji-opt',el.parentElement).forEach(b=>b.classList.remove('active'));el.classList.add('active')},
  'fill-sample':()=>{const t=$('#bulkInput');if(t){t.value=SAMPLE_TEXT;updateParsePreview();t.focus()}},
  'create-deck':()=>createDeckFromForm(),
  'save-deck-edit':el=>saveDeckEdit(el.dataset.id),
  'save-card':el=>saveCardFromModal(el.dataset.id||null,el.dataset.another==='1'),
  'duplicate-deck':el=>duplicateDeck(el.dataset.id),
  'reset-progress':el=>resetDeckProgress(el.dataset.id),
  'delete-deck':el=>deleteDeck(el.dataset.id),
  'export-deck':el=>exportDeck(el.dataset.id,el.dataset.format),
  'export-all':()=>exportAll(),
  'export-csv':()=>exportCSVAll(),
  'import-modal':()=>openImportModal(),
  'import-paste':()=>importPastedText(),
  'flip':()=>flipStudy(),
  'rate':el=>rateCurrent(el.dataset.rating),
  'prev':()=>prevCard(),
  'skip':()=>skipCard(),
  'check-typed':()=>checkTypedAnswer(),
  'quiz-answer':el=>answerQuiz(el.dataset.opt),
  'study-reverse':()=>toggleReverse(),
  'study-shuffle':()=>shuffleRemaining(),
  'focus-mode':()=>toggleFocusMode(),
  'speak':()=>speakCurrent(),
  'edit-current':()=>editCurrentCard(),
  'reset-session-score':()=>{
    if(!currentSession)return;
    currentSession.answered=0;currentSession.correct=0;currentSession.xp=0;currentSession.ratings={again:0,hard:0,good:0,easy:0};currentSession.streak=0;
    renderStudy();toast('Session score reset.',{type:'info'});
  },
  'tile':el=>pickTile(Number(el.dataset.i)),
  'theme-set':el=>setTheme(el.dataset.theme),

  'toggle-setting':el=>toggleSetting(el.dataset.key),

  'reset-all':async()=>{

    persist(true);
    try{localStorage.removeItem('flashcardTheme')}catch(e){}

    renderChrome();
    toast('All data cleared. Fresh start.',{type:'info'});

/* ================================ EVENTS ================================ */
function isTyping(){
  const el=document.activeElement;
  return !!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
}
document.addEventListener('click',e=>{
  const navBtn=e.target.closest('[data-nav]');
  if(navBtn){nav(navBtn.dataset.nav);return}
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=ACTIONS[el.dataset.act];
  if(!fn) return;
  e.preventDefault();
  try{fn(el,e)}catch(err){console.error(err);toast('Something went wrong.',{type:'error'})}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='libSearch'){ui.libSearch=e.target.value;renderDeckGrid()}
  else if(id==='deckSearch'){ui.deckSearch=e.target.value;renderCardTable()}
  else if(id==='bulkInput'){updateParsePreview()}
  else if(id==='importPaste'){
    const n=parseCards(e.target.value).length;
    const out=$('#importPasteCount');
    if(out) out.textContent=n?`${n} card${n===1?'':'s'} detected`:'Nothing detected yet';
  }
  else if(id==='cardQ'||id==='cardA'){updateCardPreview()}
  else if(id==='paletteInput'){paletteState.query=e.target.value;paletteState.idx=0;renderPaletteList()}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='libSort'){ui.libSort=e.target.value;renderDeckGrid()}
  else if(id==='cardSort'){ui.cardSort=e.target.value;renderCardTable()}
  else if(id==='importFile'){handleImportFile(e.target.files[0])}
  else if(id==='dailyGoalInput'){state.settings.dailyGoal=clamp(Number(e.target.value)||30,5,500);persist();renderChrome()}
  else if(id==='newPerDayInput'){state.settings.newPerDay=clamp(Number(e.target.value)||20,1,100);persist()}
});
document.addEventListener('keydown',e=>{
  if(paletteState.open){
    if(e.key==='ArrowDown'){e.preventDefault();paletteState.idx=Math.min(paletteState.items.length-1,paletteState.idx+1);renderPaletteList();return}
    if(e.key==='ArrowUp'){e.preventDefault();paletteState.idx=Math.max(0,paletteState.idx-1);renderPaletteList();return}
    if(e.key==='Enter'){e.preventDefault();runPaletteItem(paletteState.idx);return}
    if(e.key==='Escape'){e.preventDefault();closePalette();return}
    if(e.key==='Tab'){e.preventDefault();return}
  }
  const ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(ctrl&&e.key.toLowerCase()==='z'&&!isTyping()){e.preventDefault();undoLast();return}
  if(e.key==='Escape'){
    if($('#modalRoot').innerHTML){closeModal();return}
    if(document.body.classList.contains('focus-mode')){toggleFocusMode();return}
    const r=parseRoute();
    if(r.name==='study'||r.name==='match'){e.preventDefault();nav('deck/'+r.id);return}
    return;
  }
  if(isTyping()) return;
  const r=parseRoute();
  if(r.name!=='study'||!currentSession||currentSession.done) return;
  const quiz=isQuizMode();
  if(quiz){
    if(['a','b','c','d'].includes(e.key.toLowerCase())||['1','2','3','4'].includes(e.key)){
      const idx=['a','b','c','d'].includes(e.key.toLowerCase())?['a','b','c','d'].indexOf(e.key.toLowerCase()):Number(e.key)-1;
      const opt=currentSession.options?.[idx];
      if(opt&&currentSession.selected==null){e.preventDefault();answerQuiz(opt)}
      return;
    }
    if(e.key==='ArrowRight'){e.preventDefault();skipCard();return}
    if(e.key==='ArrowLeft'){e.preventDefault();prevCard();return}
    return;
  }
  if(currentSession.mode==='typed'&&!currentSession.showBack&&e.key==='Enter'){e.preventDefault();checkTypedAnswer();return}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flipStudy();return}
  if(currentSession.showBack&&['1','2','3','4'].includes(e.key)){e.preventDefault();rateCurrent(['again','hard','good','easy'][Number(e.key)-1]);return}
  if(e.key==='ArrowRight'){e.preventDefault();skipCard()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevCard()}
  else if(e.key.toLowerCase()==='e'){e.preventDefault();editCurrentCard()}
  else if(e.key.toLowerCase()==='s'){e.preventDefault();speakCurrent()}
  else if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFocusMode()}
});
$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal()});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closePalette()});
window.addEventListener('resize',()=>{clearTimeout(window.__confettiResize);window.__confettiResize=setTimeout(sizeConfetti,150)});
window.addEventListener('blur',()=>{try{speechSynthesis.cancel()}catch(e){}});

/* ================================= BOOT ================================= */
loadState();
applyTheme();
if(!location.hash) history.replaceState(null,'','#/library');
restoreSync();
route();
renderChrome();
</script>
